<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>রাজশাহী ডাক্তার ডিরেক্টরি</title>

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ডাক্তার ডিরেক্টরি">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E4D45">

<link id="appIcon" rel="icon" href="icon-192.png">
<link id="appleIcon" rel="apple-touch-icon" href="icon-192.png">
<link id="manifestLink" rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root{
    --bg:#FAF8F4; --ink:#2B2620; --teal:#1E4D45; --amber:#B8621B;
    --line:#DDD6C7; --line-soft:#EEE9DD; --muted:#9A9284; --muted2:#7A7263;
    --danger:#B3402E; --danger-bg:#FBEAE6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Hind Siliguri','Noto Sans Bengali','Segoe UI',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 16px;}
  header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);}
  header .inner{padding:18px 0 14px;}
  .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  h1{font-size:20px;font-weight:600;margin:0;color:var(--teal);letter-spacing:-0.01em;}
  .sub{font-size:13px;color:var(--muted2);margin:2px 0 0;}
  .icon-btn{border:1px solid var(--line);background:#fff;border-radius:999px;width:42px;height:42px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .icon-btn:active{background:#F4F1EA;}
  .search{position:relative;}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);}
  .search input{
    width:100%;padding:13px 14px 13px 40px;border:1px solid var(--line);border-radius:12px;
    font-size:15px;background:#fff;outline:none;color:var(--ink);
  }
  .search input:focus{box-shadow:0 0 0 3px rgba(30,77,69,0.13);}
  main{max-width:640px;margin:0 auto;padding:18px 16px 60px;}
  .empty{text-align:center;padding:70px 20px;color:var(--muted2);}
  .empty .big-btn{margin-top:18px;}
  .card{
    width:100%;text-align:left;background:#fff;border:1px solid var(--line-soft);border-left:3px solid var(--teal);
    border-radius:10px;padding:14px 44px 14px 15px;margin-bottom:10px;cursor:pointer;display:block;position:relative;
  }
  .card-edit-btn{
    position:absolute;top:10px;right:10px;border:1px solid var(--line);background:#fff;
    padding:6px;border-radius:8px;cursor:pointer;display:flex;
  }
  .card-edit-btn:active{background:#F4F1EA;}
  .card:active{border-color:#B8B097;}
  .card h3{margin:0;font-size:15px;font-weight:600;}
  .card .degree{font-size:12px;color:var(--muted);margin:2px 0 0;}
  .card .spec{font-size:14px;color:var(--amber);margin:6px 0 0;}
  .card .chamber{font-size:12px;color:var(--muted2);margin:8px 0 0;display:flex;align-items:center;gap:5px;}
  .big-btn{
    display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:#fff;border:none;
    padding:11px 20px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;
  }
  .full-btn{width:100%;justify-content:center;margin-bottom:18px;}
  .full-btn:disabled{opacity:0.4;}

  /* overlay sheets */
  .overlay{position:fixed;inset:0;z-index:40;display:none;}
  .overlay.show{display:block;}
  .overlay .backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.4);}
  .sheet{
    position:absolute;background:#fff;overflow-y:auto;
  }
  .sheet.bottom{left:0;right:0;bottom:0;max-height:85vh;border-radius:18px 18px 0 0;padding:20px;}
  .detail-sheet{max-height:92vh;padding:16px 20px 28px;}
  .detail-actions{display:flex;align-items:center;gap:8px;margin-bottom:14px;position:sticky;top:0;background:#fff;padding-top:2px;padding-bottom:10px;border-bottom:1px solid var(--line-soft);}
  .detail-action-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
    padding:8px 14px;border-radius:9px;font-size:13px;font-weight:500;color:var(--teal);cursor:pointer;}
  .detail-action-btn:active{background:#F4F1EA;}
  .detail-action-btn.danger{color:#B3402E;border-color:#EED4CC;}
  .detail-action-btn.danger:active{background:var(--danger-bg);}
  .sheet.side{right:0;top:0;bottom:0;width:100%;max-width:420px;box-shadow:-8px 0 24px rgba(0,0,0,0.08);}
  .sheet-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line-soft);
    padding:16px 20px;display:flex;align-items:center;justify-content:space-between;}
  .sheet-head h2{margin:0;font-size:15px;font-weight:600;color:var(--teal);display:flex;align-items:center;gap:6px;}
  .sheet-body{padding:20px;}
  .close-btn, .back-btn{border:none;background:transparent;cursor:pointer;padding:6px;border-radius:999px;display:flex;}
  .close-btn:active, .back-btn:active{background:#F4F1EA;}

  .detail-name{font-size:20px;font-weight:600;color:var(--teal);margin:0 4px 0 0;padding-right:30px;}
  .detail-degree{font-size:14px;color:var(--muted);margin:8px 0 0;line-height:1.5;}
  .detail-spec{font-size:15px;font-weight:500;color:var(--amber);margin:10px 0 0;line-height:1.5;}
  .detail-rows{margin-top:18px;border-top:1px solid var(--line-soft);padding-top:16px;}
  .drow{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start;}
  .drow .lbl{font-size:12px;color:var(--muted);margin:0 0 3px;}
  .drow .val{font-size:15px;margin:0;line-height:1.5;}

  .list-item{display:flex;align-items:center;justify-content:space-between;gap:8px;
    border:1px solid var(--line-soft);border-radius:10px;padding:11px 13px;margin-bottom:8px;}
  .list-item .info p{margin:0;}
  .list-item .name{font-size:14px;font-weight:500;}
  .list-item .meta{font-size:12px;color:var(--muted);margin-top:2px !important;}
  .list-actions{display:flex;gap:2px;flex-shrink:0;}
  .list-actions button{border:none;background:transparent;padding:7px;border-radius:8px;cursor:pointer;}
  .list-actions .edit:active{background:#F4F1EA;}
  .list-actions .del:active{background:var(--danger-bg);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:500;color:var(--muted2);margin-bottom:5px;}
  .field input{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;
    outline:none;color:var(--ink);
  }
  .field input:focus{box-shadow:0 0 0 3px rgba(30,77,69,0.13);}
  .form-actions{display:flex;gap:8px;padding-top:6px;}
  .btn-ghost{padding:11px 18px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;}
  .btn-primary{flex:1;padding:11px 18px;border:none;background:var(--teal);color:#fff;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;}
  .btn-primary:disabled{opacity:0.4;}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--teal);color:#fff;
    font-size:12px;padding:8px 16px;border-radius:999px;z-index:60;display:none;box-shadow:0 4px 14px rgba(0,0,0,0.15);}
  .toast.show{display:block;}

  .install-hint{background:#fff;border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:12px;color:var(--muted2);display:none;}
  .install-hint.show{display:block;}
  .install-hint b{color:var(--teal);}

  .btn-secondary{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:#fff;color:var(--teal);border:1px solid var(--teal);
    padding:11px 20px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:10px;
  }
  .import-info{background:#F4F1EA;border-radius:10px;padding:12px 14px;font-size:12px;color:var(--muted2);margin-bottom:16px;line-height:1.6;}
  .import-info b{color:var(--teal);}
  .preview-count{font-size:14px;font-weight:600;color:var(--teal);margin:0 0 4px;}
  .preview-sub{font-size:12px;color:var(--muted2);margin:0 0 16px;}
  .preview-row{border:1px solid var(--line-soft);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:13px;}
  .preview-row .pname{font-weight:500;}
  .preview-row .pmeta{font-size:11px;color:var(--muted);margin-top:2px;}
  .preview-list{max-height:280px;overflow-y:auto;margin-bottom:16px;}
  .col-map{font-size:12px;color:var(--muted2);background:#F4F1EA;border-radius:8px;padding:10px 12px;margin-bottom:14px;line-height:1.7;}
  .col-map b{color:var(--teal);}
  .paste-textarea{
    width:100%;min-height:220px;padding:12px 13px;border:1px solid var(--line);border-radius:10px;
    font-size:13px;font-family:inherit;outline:none;resize:vertical;line-height:1.6;
  }
  .paste-textarea:focus{box-shadow:0 0 0 3px rgba(30,77,69,0.13);}
  .paste-hint{background:#F4F1EA;border-radius:10px;padding:12px 14px;font-size:12px;color:var(--muted2);margin-bottom:14px;line-height:1.7;white-space:pre-wrap;}
  .paste-hint b{color:var(--teal);}
</style>
</head>
<body>

<header>
  <div class="wrap inner">
    <div class="row">
      <div>
        <h1>রাজশাহী ডাক্তার ডিরেক্টরি</h1>
        <p class="sub" id="countText">লোড হচ্ছে...</p>
      </div>
      <button class="icon-btn" onclick="openSettings()" aria-label="সেটিংস">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1E4D45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9A9284" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21"
